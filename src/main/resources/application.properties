spring.application.name=payment_service
server.port=${SERVER_PORT}

spring.config.import=optional:file:.env[.properties]

internal.api-key=${INTERNAL_API_KEY}

spring.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.auto-index-creation=true
logging.level.org.mongodb.driver=ERROR
logging.level.org.springframework.data.mongodb.core.MongoTemplate=ERROR

external.random.number.api.url=https://www.random.org/integers/
external.random.number.api.param.min=${RANDOM_NUMBER_API_MIN}
external.random.number.api.param.max=${RANDOM_NUMBER_API_MAX}
external.random.number.api.param.count=${RANDOM_NUMBER_API_NUMBER_COUNT}

spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=${SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES}
spring.kafka.admin.auto-create=true
spring.kafka.admin.properties.replication.factor=1
spring.kafka.admin.properties.partitions=1

spring.profiles.active=local

