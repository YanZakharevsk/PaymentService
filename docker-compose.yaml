version: '3.8'

services:
  payment-mongo:
    image: mongo:6.0
    restart: always
    environment:
      MONGO_INITDB_DATABASE: payment_db
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - payment-service-network

  payment-app:
    build: .
    image: payment-service:latest
    restart: on-failure
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_MONGODB_URI=${MONGODB_URL}
    depends_on:
      - payment-mongo
      - payment-kafka
    networks:
      - payment-service-network

  payment-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - payment-service-network

  payment-kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "29093:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: payment-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://payment-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    depends_on:
      - payment-zookeeper
    networks:
      - payment-service-network

volumes:
  mongodb_data:

networks:
  payment-service-network:
    external: true
