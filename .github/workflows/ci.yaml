name: Payment service CI

on:
  push:
    branches:
      - main
      - dev
      - feat/**
  pull_request:
    branches:
      - main
      - dev


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven


      - name: Build project
        run: mvn clean package -DskipTests



  test:
    runs-on: ubuntu-latest
    needs: build


    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017


      kafka:
        image: confluentinc/cp-kafka:7.6.1
        ports:
          - 29092:29092

        env:
          KAFKA_CFG_NODE_ID: 1
          KAFKA_CFG_PROCESS_ROLES: broker,controller

          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093

          KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093

          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092

          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

          ALLOW_PLAINTEXT_LISTENER: yes



    env:
      SERVER_PORT: 8099
      MONGODB_URL: mongodb://localhost:27017/payment-ci-db
      RANDOM_NUMBER_API_URL: https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new
      RANDOM_NUMBER_API_MIN: 10
      RANDOM_NUMBER_API_MAX: 500
      RANDOM_NUMBER_API_NUMBER_COUNT: 1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: payment-ci-group
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"


    steps:

      - name: Checkout code
        uses: actions/checkout@v4



      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven



      - name: Run tests
        run: mvn verify



      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: target/surefire-reports



  docker:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout code
        uses: actions/checkout@v4



      - name: Build Docker image
        run: docker build -t payment-service:latest .